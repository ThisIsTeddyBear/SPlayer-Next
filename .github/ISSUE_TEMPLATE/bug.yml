name: Bug Report
description: File a bug report or issue encountered while using the app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        Please describe the problem accurately and provide sufficient information so we can reproduce and fix it.
        You can also open **Developer Tools** from the Settings menu or shortcut to inspect console errors.

  - type: checkboxes
    validations:
      required: false
    attributes:
      label: "Checklist"
      description: |
        Please check the relevant items below:
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
        - label: "I have identified reproduction steps and included them below."
        - label: "This issue consistently reproduces in my environment."
        - label: "This issue reproduces on the latest release."
        - label: "This issue only started occurring after updating to the current version."

  - type: textarea
    id: environment
    validations:
      required: true
    attributes:
      label: "Environment Information"
      description: |
        Please go to **Settings - About - Environment Information** in the app, click the copy button, and paste the full information here.<br />
        *(If the app fails to launch, please manually specify your OS and client version)*
      placeholder: |
        Please copy and paste information from Settings - About - Environment Information here:
        e.g.:
        Commit: e2f0ce22
        Build Time: 2026-09-14 21:12:19
        Electron: 35.0.0
        OS: Windows_NT x64 10.0.26100
        ...

  - type: textarea
    id: other
    attributes:
      label: "Issue Details & Reproduction Steps"
      description: |
        Please provide detailed reproduction steps, expected behavior, and actual behavior. Attach screenshots, screen recordings, console error logs, or sample files if applicable.
      placeholder: "Step-by-step reproduction and details of what went wrong..."
