name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_NATIVE_BUILD: true

      - name: Regression tests
        run: pnpm test

      - name: Build application JavaScript and renderer
        run: pnpm exec electron-vite build

      - name: Sandboxed preload smoke test
        run: xvfb-run --auto-servernum pnpm test:preload --no-sandbox
