# Nightly scheduled rolling build and release
name: Nightly Build

on:
  schedule:
    # Trigger daily at UTC 18:00
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x

jobs:
  # Check if there are new commits since the last nightly release
  check-commits:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check.outputs.has_new_commits }}
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Compare commit with latest nightly release
        id: check
        shell: bash
        run: |
          NIGHTLY_TAG="v0.0.0-nightly"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger, proceeding with build"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$NIGHTLY_TAG" | awk '{print $1}')
          CURRENT_DEV_SHA=$(git rev-parse HEAD)

          echo "Current dev commit: $CURRENT_DEV_SHA"
          echo "Previous nightly tag commit: $REMOTE_TAG_SHA"

          if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" = "$CURRENT_DEV_SHA" ]; then
            echo "No new commits since last nightly build, skipping"
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected, starting nightly multi-platform build"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Check Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.has_new_commits }}" = "true" ]; then
            echo "### 🔍 Nightly Build Check: New Commits Detected" >> $GITHUB_STEP_SUMMARY
            echo "Triggered full multi-platform build matrix and rolling release." >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔍 Nightly Build Check: No New Commits" >> $GITHUB_STEP_SUMMARY
            echo "No new commits on dev branch since last nightly release. Build skipped." >> $GITHUB_STEP_SUMMARY
          fi

  # Platform builds
  build:
    name: Build on ${{ matrix.name }}
    needs: check-commits
    if: needs.check-commits.outputs.has_new_commits == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: windows-x64
          - name: Windows arm64
            runner: windows-11-arm
            target: windows-arm64
          - name: macOS x64
            runner: macos-15-intel
            target: macos-x64
          - name: macOS arm64
            runner: macos-latest
            target: macos-arm64
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            native/audio-engine -> target
            native/audio-capture -> target
            native/media-ctrl -> target
            native/taskbar-lyric -> target
            native/taskbar-thumbnail -> target
            native/opencc -> target

      # Linux: Install build and packaging dependencies
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools

      # Clean old build artifacts
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out

      # Remove .npmrc in CI
      - name: Remove .npmrc
        shell: bash
        run: rm -f .npmrc

      # Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Generate dynamic incremental nightly version
      - name: Generate Nightly Version
        shell: bash
        run: node scripts/gen-nightly-version.cjs

      # Build and generate update manifests
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: nightly
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          case "${{ matrix.target }}" in
            windows-x64)
              pnpm build:win --x64 --publish never
              ;;
            windows-arm64)
              pnpm build:win --arm64 --publish never
              ;;
            macos-x64)
              pnpm build:mac --x64 --publish never
              ;;
            macos-arm64)
              pnpm build:mac --arm64 --publish never
              ;;
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      # Upload artifacts for release aggregation
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-${{ matrix.target }}
          path: dist/*.*

      # Generate Job Summary
      - name: Generate Job Summary
        if: always()
        shell: bash
        run: |
          echo "### 📦 Build Artifacts - ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Format | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          found=0
          for f in dist/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              ext="${fname##*.}"
              case "$ext" in
                exe|dmg|zip|AppImage|deb|rpm|pacman|gz)
                  fsize=$(ls -lh "$f" | awk '{print $5}')
                  echo "| \`$fname\` | **$ext** | $fsize |" >> $GITHUB_STEP_SUMMARY
                  found=1
                  ;;
              esac
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "| *(No package generated or build interrupted)* | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

  # Merge multi-arch manifests and roll release to fixed tag v0.0.0-nightly
  release:
    name: Publish Nightly Release
    needs: [check-commits, build]
    if: needs.check-commits.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Read injected nightly version
      - name: Read Nightly Version
        shell: bash
        run: |
          node scripts/gen-nightly-version.cjs
          VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Prepare release assets
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets "$APP_VERSION"
          echo "Assets to publish:"
          ls -1 release-assets

      # Rolling release to fixed tag v0.0.0-nightly
      - name: Publish or Update Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: v0.0.0-nightly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$NIGHTLY_TAG"
          git push -f origin "$NIGHTLY_TAG"

          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Resetting existing Nightly Release..."
            gh release delete "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_HASH=$(git rev-parse --short HEAD)

          cat > notes.md << 'EOF'
          ⚡ **Daily Continuous Build (Nightly Build)**

          - **Version**: `$APP_VERSION`
          - **Latest Commit**: [`$COMMIT_HASH`](https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_HASH) - $COMMIT_MSG
          - **Build Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Platforms**: Windows (x64 / arm64), macOS (x64 / arm64), Linux (x64 / arm64)
          - **Description**: Automated nightly build from `dev` branch for testing and verification. Switch client channel to `Nightly` to receive updates.
          EOF

          gh release create "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SPlayer-Next Nightly Build ($APP_VERSION)" \
            --notes-file notes.md \
            --prerelease \
            release-assets/*

      # Generate Release Summary
      - name: Generate Release Summary
        if: success()
        shell: bash
        run: |
          echo "## 🌙 SPlayer-Next Nightly Build Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Info |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 **Version** | \`$APP_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ **Release Tag** | [\`$NIGHTLY_TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$NIGHTLY_TAG) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 **Base Branch** | \`dev\` ([${COMMIT_HASH}](https://github.com/$GITHUB_REPOSITORY/commit/${COMMIT_HASH})) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 **Commit Message** | $COMMIT_MSG |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Install Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform & Arch | File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              ext="${fname##*.}"
              case "$ext" in
                exe|dmg|AppImage|deb|rpm|pacman|tar.gz)
                  fsize=$(ls -lh "$f" | awk '{print $5}')
                  plat="💻 Other"
                  if [[ "$fname" =~ [wW]in|setup|portable|\.exe ]]; then
                    plat="🪟 Windows"
                  elif [[ "$fname" =~ [mM]ac|\.dmg ]]; then
                    plat="🍎 macOS"
                  elif [[ "$fname" =~ [lL]inux|\.AppImage|\.deb|\.rpm|\.pacman|\.tar\.gz ]]; then
                    plat="🐧 Linux"
                  fi
                  echo "| $plat | [📥 \`$fname\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$NIGHTLY_TAG/$fname) | $fsize |" >> $GITHUB_STEP_SUMMARY
                  ;;
              esac
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Auto Update Manifests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest File | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          [ -f "release-assets/nightly.yml" ] && echo "| \`nightly.yml\` | Windows (x64 / arm64) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          [ -f "release-assets/nightly-mac.yml" ] && echo "| \`nightly-mac.yml\` | macOS (x64 / arm64) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          [ -f "release-assets/nightly-linux.yml" ] && echo "| \`nightly-linux.yml\` | Linux (x64) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          [ -f "release-assets/nightly-linux-arm64.yml" ] && echo "| \`nightly-linux-arm64.yml\` | Linux (arm64) | ✅ Ready |" >> $GITHUB_STEP_SUMMARY

